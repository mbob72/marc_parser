services:
  api:
    build: .
    image: marc-parser:local
    command: ["node", "dist/api.js"]
    environment: &app-environment
      DATABASE_URL: postgres://marc:marc@postgres:5432/marc_parser
      RABBITMQ_URL: amqp://marc:marc@rabbitmq:5672
      RABBITMQ_QUEUE: marc.convert
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: marc
      MINIO_SECRET_KEY: marc-secret
      MINIO_BUCKET: marc-jobs
      MAX_UPLOAD_BYTES: "5368709120"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    image: marc-parser:local
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-environment
      WORKER_CONCURRENCY: "2"
      JOB_MAX_ATTEMPTS: "3"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_DB: marc_parser
      POSTGRES_USER: marc
      POSTGRES_PASSWORD: marc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marc -d marc_parser"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: public.ecr.aws/docker/library/rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: marc
      RABBITMQ_DEFAULT_PASS: marc
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: marc
      MINIO_ROOT_PASSWORD: marc-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
